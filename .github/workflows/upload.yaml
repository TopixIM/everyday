name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Resolve immutable dependencies
        run: |
          set -euo pipefail
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate client and server entries
        run: |
          set -euo pipefail
          test "$(calcit --version)" = "0.27.0"
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --keep-going
          calcit calcit.cirru --entry server --check-only --keep-going
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru analyze check-public \
            --ns app.client --ns app.comp.container --ns app.comp.history \
            --ns app.comp.login --ns app.comp.navigation --ns app.comp.plan \
            --ns app.comp.profile --ns app.comp.today --ns app.config \
            --ns app.schema --ns app.style --ns app.twig.container \
            --ns app.twig.user --ns app.updater --ns app.updater.operation \
            --ns app.updater.plan --ns app.updater.router \
            --ns app.updater.session --ns app.updater.user --ns app.util \
            --summary-only --format json
          calcit calcit.cirru --entry server analyze check-public \
            --ns app.config --ns app.schema --ns app.server \
            --ns app.twig.container --ns app.twig.user --ns app.updater \
            --ns app.updater.operation --ns app.updater.plan \
            --ns app.updater.router --ns app.updater.session \
            --ns app.updater.user \
            --summary-only --format json
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types \
            --only schema-dynamic,code-dynamic --intent unresolved \
            --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru --entry server analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru --entry server analyze dynamic-methods

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${{ github.event.pull_request.number }}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web and server artifacts
        run: |
          set -euo pipefail
          yarn build
          calcit calcit.cirru --entry server ir
          mkdir -p dist-server
          cp js-out/program-ir.cirru dist-server/compact.cirru
          cp calcit.cirru deps.cirru package.json dist-server/

      - name: Check COS credentials
        id: cos-credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify static assets on COS
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        timeout-minutes: 10
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy web and server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/everyday-ssh"
          key_file="$ssh_dir/id_ed25519"
          known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
          matching_keys="$ssh_dir/tiye.me-ed25519"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
          trap 'rm -f "$key_file" "$matching_keys"' EXIT
          awk '$1 == "tiye.me" && $2 == "ssh-ed25519" { print }' "$known_hosts_file" > "$matching_keys"
          test "$(awk 'NF { count += 1 } END { print count + 0 }' "$matching_keys")" -eq 1
          actual_fingerprint="$(ssh-keygen -lf "$matching_keys" | awk '{ print $2 }')"
          test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'
          ssh_command="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file"
          rsync -avzr --progress -e "$ssh_command" dist/ "rsync-user@tiye.me:/web-assets/repo/${GITHUB_REPOSITORY}/"
          rsync -avzr --progress -e "$ssh_command" dist-server/ "rsync-user@tiye.me:/servers/paste-sharing/"
