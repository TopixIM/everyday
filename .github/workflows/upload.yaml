name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Set up Calcit 0.14.17 and Caps
        uses: calcit-lang/setup-calcit@d02594b15f0e9de723fe1a202a3fa62a87afe07b # v1.4.0
        with:
          version: 0.14.17
          tools: calcit,caps

      - name: Resolve immutable dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check canonical snapshot
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru

      - name: Check client and server entries
        run: |
          set -euo pipefail
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only

      - name: Check upgrade quality baseline
        run: |
          set -euo pipefail
          calcit calcit.cirru analyze deprecated --summary-only
          calcit calcit.cirru --entry server analyze deprecated --summary-only
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru --entry server analyze dynamic-methods --max 0
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Build web and server artifacts
        run: |
          set -euo pipefail
          calcit calcit.cirru js
          yarn vite build --base=./
          calcit calcit.cirru --entry server ir
          mkdir -p dist-server
          cp js-out/program-ir.cirru dist-server/compact.cirru
          cp calcit.cirru deps.cirru package.json dist-server/

      - name: Deploy web and server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/everyday-ssh"
          key_file="$ssh_dir/id_ed25519"
          known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
          matching_keys="$ssh_dir/tiye.me-ed25519"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
          trap 'rm -f "$key_file" "$matching_keys"' EXIT
          awk '$1 == "tiye.me" && $2 == "ssh-ed25519" { print }' "$known_hosts_file" > "$matching_keys"
          test "$(awk 'NF { count += 1 } END { print count + 0 }' "$matching_keys")" -eq 1
          actual_fingerprint="$(ssh-keygen -lf "$matching_keys" | awk '{ print $2 }')"
          test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'
          ssh_command="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file"
          rsync -avzr --progress -e "$ssh_command" dist/ "rsync-user@tiye.me:/web-assets/repo/${GITHUB_REPOSITORY}/"
          rsync -avzr --progress -e "$ssh_command" dist-server/ "rsync-user@tiye.me:/servers/paste-sharing/"
